# Build the browser apps (Danas Piano Tutor + Danas Ear) and publish dist/ to
# GitHub Pages on every push to main. Pyodide, numpy and Bravura are
# downloaded during the build, so they never need to be committed.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build dependencies
        run: pip install numpy
      - name: Cache vendored runtime (Pyodide, numpy wheel, Bravura)
        uses: actions/cache@v4
        with:
          path: web/vendor
          key: vendor-${{ hashFiles('tools/build_web.py') }}
      - name: Run the core tests
        run: python -m unittest tests.test_teach -q
      - name: Build dist/
        run: |
          python tools/build_web.py --vendor --dist
          touch dist/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
